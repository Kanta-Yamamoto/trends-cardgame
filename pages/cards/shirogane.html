html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 30%, var(--stage-2), var(--stage) 70%);
  color:var(--cap); font-family:var(--f-body);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  padding-block:24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  overflow:hidden; touch-action:none;
}
.stage{perspective:1100px; width:min(82vw, 400px, calc((100vh - 120px) * 0.716)); max-width:100%}
.card{
  --rx:0deg; --ry:0deg; --mx:50%; --my:50%; --nx:0; --ny:0; --g:0;
  position:relative; width:100%; aspect-ratio:63/88; border-radius:4.2%/3%;
  transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .12s ease-out;
  box-shadow:0 30px 60px -20px #000a, 0 0 0 1px #ffffff30;
  background:var(--pearl); overflow:hidden; isolation:isolate;
  cursor:grab;
}
.layer{position:absolute; inset:0}
/* art window */
.bg{
  background:url(../../assets/cards/c1-art.jpg) center 42%/cover no-repeat;
  transform:translate(calc(var(--nx) * -7px), calc(var(--ny) * -7px)) scale(1.05);
  clip-path:inset(4.6% 5.4% 4.6% 5.4% round 2.2%);
}
.bg-holo{
  clip-path:inset(4.6% 5.4% 4.6% 5.4% round 2.2%);
  background:
    repeating-linear-gradient(118deg,
      #ff7ad9 0%, #ffd36e 4%, #7dffb0 8%, #6ec9ff 12%, #b48cff 16%, #ff7ad9 20%);
  background-size:260% 260%;
  background-position:var(--mx) var(--my);
  mix-blend-mode:color-dodge; opacity:calc(.16 + var(--g) * .22);
  filter:saturate(1.3);
}
.glitter{
  clip-path:inset(4.6% 5.4% 4.6% 5.4% round 2.2%);
  background:var(--glitter) repeat; background-size:110px;
  background-position:calc(var(--nx) * 14px) calc(var(--ny) * 14px);
  mix-blend-mode:screen; opacity:calc(.25 + var(--g) * .55);
  -webkit-mask-image:radial-gradient(60% 50% at var(--mx) var(--my), #000 0%, transparent 100%);
          mask-image:radial-gradient(60% 50% at var(--mx) var(--my), #000 0%, transparent 100%);
}
/* pearl frame with etched lines */
.frame-holo{
  background:
    repeating-linear-gradient(62deg, #ffffff 0 2px, #e6ebf5 2px 5px),
    linear-gradient(135deg, #fbfcff, #d9dfeb 45%, #fbfcff 55%, #cfd6e4);
  background-blend-mode:multiply;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 4.6%,5.4% 4.6%,5.4% 95.4%,94.6% 95.4%,94.6% 4.6%,0 4.6%);
}
.frame-holo::after{
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(118deg,#ff7ad9 0%,#ffd36e 5%,#7dffb0 10%,#6ec9ff 15%,#b48cff 20%,#ff7ad9 25%);
  background-size:240% 240%; background-position:var(--mx) var(--my);
  mix-blend-mode:color-burn; opacity:calc(.22 + var(--g) * .3);
}
.inner-line{
  inset:4.6% 5.4%; border-radius:2.2%;
  box-shadow:0 0 0 1.5px var(--silver), 0 0 0 3.5px #fff, 0 0 0 4.5px var(--steel);
  pointer-events:none;
}
/* the figure breaking the frame */
.subject{
  background:url(../../assets/cards/c1-subject.webp) center 42%/cover no-repeat;
  transform:translate(calc(var(--nx) * 7px), calc(var(--ny) * 7px)) scale(1.05);
  filter:drop-shadow(0 6px 10px #1b223355);
  pointer-events:none;
}
.subject-holo{
  -webkit-mask:url(../../assets/cards/c1-subject.webp) center 42%/cover no-repeat;
          mask:url(../../assets/cards/c1-subject.webp) center 42%/cover no-repeat;
  transform:translate(calc(var(--nx) * 7px), calc(var(--ny) * 7px)) scale(1.05);
  background:repeating-linear-gradient(118deg,#ff7ad9 0%,#ffd36e 4%,#7dffb0 8%,#6ec9ff 12%,#b48cff 16%,#ff7ad9 20%);
  background-size:260% 260%; background-position:var(--mx) var(--my);
  mix-blend-mode:soft-light; opacity:calc(.25 + var(--g) * .35); pointer-events:none;
}
/* type and stats */
.cost{
  position:absolute; left:2.4%; top:1.7%; width:17%; aspect-ratio:1; border-radius:50%;
  display:grid; place-items:center;
  background:radial-gradient(circle at 35% 30%, #fff, #e3e8f2 45%, #aeb8ca 80%, #8b96ac);
  box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--steel), 0 6px 14px -4px #1b223388;
  z-index:3;
}
.cost b{
  font:800 2.35em/1 var(--f-num); color:var(--ink);
  text-shadow:0 1px 0 #fff, 0 -1px 0 #0002;
}
.rarity{
  position:absolute; right:7.5%; top:6.4%; z-index:3;
  font:800 .78em/1 var(--f-num); letter-spacing:.14em; color:var(--ink);
  padding:.42em .6em .38em .74em; border-radius:2em;
  background:linear-gradient(110deg,#fff8,#ffffffd8 40%,#e9eef8d8); backdrop-filter:blur(3px);
  box-shadow:0 0 0 1px #ffffffb0, 0 0 0 2px #7f8aa060;
}
.plate{
  position:absolute; left:5.4%; right:5.4%; bottom:4.6%; height:37%;
  z-index:2; display:flex; flex-direction:column;
}
.name{
  margin:0 0 0 2.5%; align-self:flex-start;
  display:flex; align-items:baseline; gap:.55em; flex-wrap:wrap;
  padding:.5em .95em .45em; border-radius:.4em .4em 0 0;
  background:linear-gradient(100deg,#ffffffee,#f2f5fbe0 70%,#ffffffb0);
  box-shadow:inset 0 -1px 0 var(--silver);
}
.name .epi{font:700 .64em/1 var(--f-body); color:var(--ink-soft); letter-spacing:.08em}
.name h1{margin:0; font:800 1.32em/1.05 var(--f-name); color:var(--ink); letter-spacing:.04em; text-wrap:balance}
.box{
  flex:1; position:relative; display:flex; flex-direction:column; gap:.55em;
  padding:.85em 1.05em .8em;
  background:linear-gradient(180deg,#ffffffd6,#f4f7fcc4 60%,#eef2f9d8);
  backdrop-filter:blur(5px) saturate(1.2); -webkit-backdrop-filter:blur(5px) saturate(1.2);
  border-radius:0 .5em .5em .5em;
  box-shadow:inset 0 0 0 1px #ffffffc0, 0 -6px 18px -10px #1b223340;
}
.tribe{
  align-self:flex-start; font:700 .64em/1 var(--f-body); letter-spacing:.16em; color:var(--pearl);
  background:linear-gradient(90deg,var(--ink),#3b4766); padding:.42em .8em .38em; border-radius:2em;
}
.effect{margin:0; font:500 .8em/1.65 var(--f-body); color:var(--ink); text-wrap:pretty}
.effect .kw{font-weight:700; letter-spacing:.02em}
.flavor{margin:0; font:700 .7em/1.5 var(--f-name); color:var(--ink-soft); font-style:normal}
.foot{
  margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:.6em;
}
.no{font:600 .56em/1 var(--f-num); letter-spacing:.12em; color:var(--steel); font-variant-numeric:tabular-nums}
.power{display:flex; align-items:baseline; gap:.35em}
.power small{font:700 .52em/1 var(--f-num); letter-spacing:.2em; color:var(--ink-soft)}
.power b{
  font:800 1.85em/.9 var(--f-num); letter-spacing:.02em; font-variant-numeric:tabular-nums;
  background:linear-gradient(100deg,#1b2233,#56627e 45%,#1b2233 55%,#3a4560);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.glare{
  z-index:4; pointer-events:none;
  background:radial-gradient(farthest-corner circle at var(--mx) var(--my), #ffffffcc 0%, #ffffff30 22%, transparent 55%);
  mix-blend-mode:overlay; opacity:calc(.35 + var(--g) * .55);
}
.card-inner{position:absolute; inset:0; font-size:calc(var(--w, 360px) / 24)}
.hint{margin:0; font-size:12px; letter-spacing:.08em; color:var(--cap); text-align:center}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>

<div class="stage" id="stage">
  <div class="card" id="card" role="img" aria-label="キラカード「光輪の招き手 シロガネ」コスト8、パワー8000、種族〈光輪〉">
    <div class="card-inner" id="inner">
      <div class="layer bg"></div>
      <div class="layer bg-holo"></div>
      <div class="layer glitter"></div>
      <div class="layer frame-holo"></div>
      <div class="layer inner-line"></div>
      <div class="layer subject"></div>
      <div class="layer subject-holo"></div>

      <div class="cost"><b>8</b></div>
      <div class="rarity">UR</div>

      <div class="plate">
        <div class="name"><span class="epi">光輪の招き手</span><h1>シロガネ</h1></div>
        <div class="box">
          <span class="tribe">光輪</span>
          <p class="effect">このキャラクターは、場にある他の<span class="kw">〈光輪〉</span>カード1枚につき、コストが1下がる。</p>
          <p class="flavor">「さあ、こちら側へ。光はもう、君を選んでいる」</p>
          <div class="foot">
            <span class="no">001 / 040 · TRENDS</span>
            <span class="power"><small>POWER</small><b>8000</b></span>
          </div>
        </div>
      </div>
      <div class="layer glare"></div>
    </div>
  </div>
</div>
<p class="hint">カーソルやドラッグでカードを傾けられます</p>

<script>
(() => {
  const stage = document.getElementById('stage');
  const card = document.getElementById('card');
  const inner = document.getElementById('inner');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = () => inner.style.setProperty('--w', card.clientWidth + 'px');
  fit(); addEventListener('resize', fit);

  let last = 0, active = false;
  function set(nx, ny, g){
    nx = Math.max(-1, Math.min(1, nx)); ny = Math.max(-1, Math.min(1, ny));
    card.style.setProperty('--nx', nx.toFixed(3));
    card.style.setProperty('--ny', ny.toFixed(3));
    card.style.setProperty('--ry', (nx * 16).toFixed(2) + 'deg');
    card.style.setProperty('--rx', (-ny * 13).toFixed(2) + 'deg');
    card.style.setProperty('--mx', (50 + nx * 50).toFixed(1) + '%');
    card.style.setProperty('--my', (50 + ny * 50).toFixed(1) + '%');
    card.style.setProperty('--g', g.toFixed(2));
  }
  function onMove(e){
    const r = card.getBoundingClientRect();
    const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    const ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    active = true; last = performance.now();
    set(nx, ny, Math.min(1, Math.hypot(nx, ny)));
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerdown', onMove);
  document.addEventListener('pointerleave', () => { active = false; });

  set(-0.35, -0.25, 0.5);
  if (reduce) return;
  function idle(t){
    if (!active || t - last > 2200){
      active = false;
      const s = t / 1000;
      set(Math.sin(s * 0.7) * 0.55, Math.sin(s * 1.1 + 1) * 0.35, 0.45 + Math.sin(s * 0.9) * 0.25);
    }
    requestAnimationFrame(idle);
  }
  requestAnimationFrame(idle);
})();
</script>
