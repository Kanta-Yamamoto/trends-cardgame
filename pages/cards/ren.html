html,body{height:100%}
body{
  background:radial-gradient(110% 70% at 50% 35%, var(--stage-2), var(--stage) 70%);
  color:var(--cap); font-family:var(--f-body);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  padding-block:24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  overflow:hidden; touch-action:none;
}
.stage{perspective:1000px; width:min(82vw, 400px, calc((100vh - 120px) * 0.716)); max-width:100%}
.card{
  --rx:0deg; --ry:0deg; --mx:50%; --my:50%; --nx:0; --ny:0; --g:0;
  position:relative; width:100%; aspect-ratio:63/88; border-radius:4.2%/3%;
  transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .1s ease-out;
  box-shadow:0 30px 70px -18px #000, 0 0 50px -10px #e3263a55, 0 0 0 1px #ffffff1a;
  background:var(--obsidian); overflow:hidden; isolation:isolate; cursor:grab;
}
.card-inner{position:absolute; inset:0; font-size:calc(var(--w, 360px) / 24)}
.layer{position:absolute; inset:0}
.win{clip-path:inset(4.4% 5.2% 4.4% 5.2% round 1.6%)}

/* black mirror foil frame */
.frame{
  background:
    linear-gradient(115deg, transparent 30%, #ffffff2e 46%, #ffffff55 50%, #ffffff2e 54%, transparent 70%) var(--mx) var(--my)/260% 260% no-repeat,
    linear-gradient(160deg, #1a1619, #050406 45%, #1d171b 70%, #060507);
}
.frame-red{
  background:radial-gradient(55% 45% at var(--mx) var(--my), var(--ember), var(--blood) 40%, transparent 75%);
  -webkit-mask:var(--glitter) repeat 0 0/90px; mask:var(--glitter) repeat 0 0/90px;
  opacity:calc(.35 + var(--g) * .65);
}
/* embossed flame pattern: a lit edge and a shadow edge that trade places as the card tilts */
.emboss-hi, .emboss-lo{
  -webkit-mask:var(--flame) repeat; mask:var(--flame) repeat;
  -webkit-mask-size:1.9em 2.5em; mask-size:1.9em 2.5em;
}
.emboss-hi{background:#ffffff38; transform:translate(calc(var(--nx) * -1px), calc(var(--ny) * -1px))}
.emboss-lo{background:#000000d0; transform:translate(calc(var(--nx) * 1px), calc(var(--ny) * 1px))}
.emboss-face{
  -webkit-mask:var(--flame) repeat; mask:var(--flame) repeat;
  -webkit-mask-size:1.9em 2.5em; mask-size:1.9em 2.5em;
  background:linear-gradient(160deg,#241c20,#0c0a0d);
}

/* art */
.bg{
  background:url(../../assets/cards/c2-art.jpg) center 38%/cover no-repeat;
  transform:translate(calc(var(--nx) * -8px), calc(var(--ny) * -8px)) scale(1.06);
}
/* radial speed-line holo, centred on the face, swings with the tilt */
.speed{
  background:repeating-conic-gradient(from calc(var(--nx) * 40deg) at 60% 30%,
    transparent 0deg, transparent 2.2deg, #ff3b4f 2.6deg, #fff3ee 2.9deg, #ff3b4f 3.2deg, transparent 3.8deg, transparent 6deg);
  mix-blend-mode:color-dodge; opacity:calc(.12 + var(--g) * .5);
  -webkit-mask-image:radial-gradient(70% 55% at var(--mx) var(--my), #000 0%, transparent 85%);
          mask-image:radial-gradient(70% 55% at var(--mx) var(--my), #000 0%, transparent 85%);
}
.sparks{
  background:radial-gradient(60% 50% at var(--mx) var(--my), #ffd0c4, var(--ember) 45%, transparent 80%);
  -webkit-mask:var(--glitter) repeat calc(var(--nx) * 16px) calc(var(--ny) * 16px)/120px;
          mask:var(--glitter) repeat calc(var(--nx) * 16px) calc(var(--ny) * 16px)/120px;
  mix-blend-mode:screen; opacity:calc(.3 + var(--g) * .7);
}
.inner-line{
  inset:4.4% 5.2%; border-radius:1.6%; pointer-events:none;
  box-shadow:0 0 0 1.5px #000, 0 0 0 2.5px var(--blood), 0 0 12px 2px #e3263a66;
}
/* the figure breaking out */
.subject{
  background:url(../../assets/cards/c2-subject.webp) center 38%/cover no-repeat;
  transform:translate(calc(var(--nx) * 9px), calc(var(--ny) * 9px)) scale(1.06);
  filter:drop-shadow(0 8px 12px #000c) drop-shadow(0 0 6px #e3263a55);
  pointer-events:none;
}
.subject-shine{
  -webkit-mask:url(../../assets/cards/c2-subject.webp) center 38%/cover no-repeat; mask:url(../../assets/cards/c2-subject.webp) center 38%/cover no-repeat;
  transform:translate(calc(var(--nx) * 9px), calc(var(--ny) * 9px)) scale(1.06);
  background:linear-gradient(115deg, transparent 35%, #ff6a5a 47%, #fff 50%, #ff6a5a 53%, transparent 65%) var(--mx) var(--my)/260% 260% no-repeat;
  mix-blend-mode:soft-light; opacity:calc(.2 + var(--g) * .55); pointer-events:none;
}

/* stats and type */
.cost{
  position:absolute; left:2.2%; top:1.6%; width:16.5%; aspect-ratio:1; z-index:3;
  display:grid; place-items:center; border-radius:50%;
  background:radial-gradient(circle at 35% 28%, #3b2a30, #120d10 55%, #050405);
  box-shadow:0 0 0 2px #000, 0 0 0 3.5px var(--blood), 0 0 18px -2px #e3263aaa, inset 0 2px 6px #ffffff22;
}
.cost b, .foil{
  background:linear-gradient(100deg,#6d0a15 0%,#e3263a 28%,#ffe6dc 46%,#ff5a4a 56%,#7a0c16 80%,#e3263a 100%);
  background-size:260% 100%; background-position:var(--mx) 0;
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.cost b{font:800 2.3em/1 var(--f-num); filter:drop-shadow(0 1px 0 #000)}
.rarity{
  position:absolute; right:7.4%; top:6%; z-index:3;
  font:800 .74em/1 var(--f-num); letter-spacing:.18em; color:var(--bone);
  padding:.45em .62em .4em .8em; border-radius:.2em;
  background:linear-gradient(110deg,#e3263a,#7a0c16); box-shadow:0 0 0 1px #000, 0 0 0 2px #e3263a80, 0 4px 12px -4px #000;
  transform:skewX(-12deg);
}
.plate{
  position:absolute; left:23%; right:5.2%; bottom:4.4%; height:36%;
  z-index:2; display:flex; flex-direction:column;
}
.name{
  align-self:flex-end; margin-right:3%;
  display:flex; align-items:baseline; gap:.5em; flex-wrap:wrap; justify-content:flex-end;
  padding:.5em .9em .42em; transform:skewX(-12deg);
  background:linear-gradient(100deg,#000000d8,#1a0e12e8); box-shadow:inset 0 -2px 0 var(--blood);
}
.name > *{transform:skewX(12deg)}
.name .epi{font:700 .6em/1 var(--f-body); letter-spacing:.1em; color:var(--ash)}
.name h1{margin:0; font:400 1.42em/1.05 var(--f-name); letter-spacing:.06em; text-wrap:balance}
.box{
  flex:1; display:flex; flex-direction:column; gap:.5em; min-width:0;
  padding:.8em .95em .7em;
  background:linear-gradient(180deg,#0c080ad0,#0a0709e6);
  backdrop-filter:blur(4px) saturate(1.3); -webkit-backdrop-filter:blur(4px) saturate(1.3);
  clip-path:polygon(4% 0,100% 0,100% 100%,0 100%,0 7%);
  box-shadow:inset 0 0 0 1px #e3263a40;
}
.tribe{
  align-self:flex-start; font:700 .6em/1 var(--f-body); letter-spacing:.18em; color:var(--bone);
  background:var(--blood); padding:.42em .75em .38em; transform:skewX(-12deg);
}
.effect{margin:0; font:500 .72em/1.6 var(--f-body); color:var(--bone); text-wrap:pretty}
.effect .kw{font-weight:700; color:var(--ember)}
.flavor{margin:0; font:700 .64em/1.5 var(--f-body); color:var(--ash)}
.foot{margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:.5em}
.serial{
  font:600 .52em/1.2 var(--f-num); letter-spacing:.12em; color:var(--cap); font-variant-numeric:tabular-nums;
  text-shadow:0 -1px 0 #000, 0 1px 0 #ffffff1c;
}
.serial b{display:block; color:var(--bone); font-weight:800}
.power{display:flex; align-items:baseline; gap:.3em}
.power small{font:700 .5em/1 var(--f-num); letter-spacing:.2em; color:var(--ash)}
.power b{font:800 1.75em/.9 var(--f-num); font-variant-numeric:tabular-nums}
.glare{
  z-index:4; pointer-events:none;
  background:radial-gradient(farthest-corner circle at var(--mx) var(--my), #ffd6cc66 0%, #ff5a4a1c 25%, transparent 55%);
  mix-blend-mode:screen; opacity:calc(.25 + var(--g) * .6);
}
.hint{margin:0; font-size:12px; letter-spacing:.08em; color:var(--cap); text-align:center}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>

<div class="stage" id="stage">
  <div class="card" id="card" role="img" aria-label="キラカード「紅蓮の簒奪者 レン」コスト6、パワー7200、種族〈紅蓮〉">
    <div class="card-inner" id="inner">
      <div class="layer frame"></div>
      <div class="layer emboss-lo"></div>
      <div class="layer emboss-hi"></div>
      <div class="layer emboss-face"></div>
      <div class="layer frame-red"></div>

      <div class="layer win"><div class="layer bg"></div><div class="layer speed"></div><div class="layer sparks"></div></div>
      <div class="layer inner-line"></div>
      <div class="layer subject"></div>
      <div class="layer subject-shine"></div>

      <div class="cost"><b>6</b></div>
      <div class="rarity">SEC</div>

      <div class="plate">
        <div class="name"><span class="epi">紅蓮の簒奪者</span><h1 class="foil">レン</h1></div>
        <div class="box">
          <span class="tribe">紅蓮</span>
          <p class="effect"><span class="kw">速攻</span>（場に出たターンに攻撃できる）。このキャラクターが攻撃したとき、相手の手札を1枚選んで捨てさせる。</p>
          <p class="flavor">「遅えよ。全部、俺がもらってく」</p>
          <div class="foot">
            <span class="serial">SERIAL<b>No. 007 / 100</b></span>
            <span class="power"><small>POWER</small><b class="foil">7200</b></span>
          </div>
        </div>
      </div>
      <div class="layer glare"></div>
    </div>
  </div>
</div>
<p class="hint">カーソルやドラッグでカードを傾けられます</p>

<script>
(() => {
  const card = document.getElementById('card');
  const inner = document.getElementById('inner');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = () => inner.style.setProperty('--w', card.clientWidth + 'px');
  fit(); addEventListener('resize', fit);

  let last = 0, active = false;
  function set(nx, ny, g){
    nx = Math.max(-1, Math.min(1, nx)); ny = Math.max(-1, Math.min(1, ny));
    const s = card.style;
    s.setProperty('--nx', nx.toFixed(3));
    s.setProperty('--ny', ny.toFixed(3));
    s.setProperty('--ry', (nx * 17).toFixed(2) + 'deg');
    s.setProperty('--rx', (-ny * 14).toFixed(2) + 'deg');
    s.setProperty('--mx', (50 + nx * 50).toFixed(1) + '%');
    s.setProperty('--my', (50 + ny * 50).toFixed(1) + '%');
    s.setProperty('--g', g.toFixed(2));
  }
  function onMove(e){
    const r = card.getBoundingClientRect();
    const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    const ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    active = true; last = performance.now();
    set(nx, ny, Math.min(1, Math.hypot(nx, ny)));
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerdown', onMove);
  document.addEventListener('pointerleave', () => { active = false; });

  set(0.4, -0.3, 0.55);
  if (reduce) return;
  function idle(t){
    if (!active || t - last > 2200){
      active = false;
      const s = t / 1000;
      set(Math.sin(s * 0.9) * 0.6, Math.sin(s * 1.3 + 1) * 0.4, 0.5 + Math.sin(s * 1.1) * 0.3);
    }
    requestAnimationFrame(idle);
  }
  requestAnimationFrame(idle);
})();
</script>
