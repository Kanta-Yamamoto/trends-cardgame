<title>TRENDS 対戦フィールド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Dela+Gothic+One&family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@800&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-screen tabletop. Opponent at the top, your side below the centre line, your hand fanned along the bottom edge. Cards live on one fixed layer and spring between hand, field and targets. */
:root{
  color-scheme: dark;
  --table:#0b1018; --table-2:#162133; --zone:#9fb6d61f; --zone-hi:#8fd8ff;
  --text:#e8ecf4; --muted:#8e9bb1; --gold:#f2cf7a; --foe:#ff5a6a; --mana:#8fd8ff;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Cinzel","Times New Roman",serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:
    radial-gradient(120% 60% at 50% 52%, #1d2b44 0%, transparent 60%),
    radial-gradient(100% 80% at 50% 100%, #0f1a2c, var(--table) 70%);
  color:var(--text); font-family:var(--f-ui);
  overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
}
#world{position:fixed; inset:0}
.board{
  position:relative; height:100%; margin:0 auto; max-width:760px; box-sizing:border-box;
  display:grid; grid-template-rows:auto auto 1fr auto 1fr auto var(--handH, 150px);
  padding-block:10px 0;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.board::before{ /* faint hex lattice on the table */
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:
    repeating-linear-gradient(60deg, #ffffff07 0 1px, transparent 1px 22px),
    repeating-linear-gradient(-60deg, #ffffff07 0 1px, transparent 1px 22px);
  -webkit-mask:radial-gradient(70% 60% at 50% 50%, #000, transparent); mask:radial-gradient(70% 60% at 50% 50%, #000, transparent);
}
.ehand{display:flex; justify-content:center; height:34px; position:relative}
.ehand .bk{
  width:24px; height:34px; margin:0 -3px; border-radius:3px;
  background:repeating-linear-gradient(60deg,#ffffff12 0 1px,transparent 1px 6px), linear-gradient(160deg,#26324a,#0e1320);
  box-shadow:0 0 0 1px #c9d3e680, 0 4px 8px -2px #000;
}
.info{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-block:6px}
.leader{display:flex; align-items:center; gap:10px; border-radius:99px; padding:4px 14px 4px 4px; background:#ffffff0a; box-shadow:inset 0 0 0 1px #ffffff14; position:relative}
.leader .av{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font:700 12px/1 var(--f-ui)}
.leader.enemy .av{background:radial-gradient(circle at 35% 30%,#ff8a96,#8a1c2b); }
.leader.me .av{background:radial-gradient(circle at 35% 30%,#bfe8ff,#2a6fa3); }
.lp small{display:block; font:700 9px/1 var(--f-ui); letter-spacing:.14em; color:var(--muted); margin-bottom:3px}
.lp b{font:800 19px/1 var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.leader.targetable{box-shadow:inset 0 0 0 1px #ffffff14, 0 0 0 2px var(--foe), 0 0 22px #ff5a6a88; animation:pulse 1s ease-in-out infinite; cursor:pointer}
@keyframes pulse{50%{box-shadow:inset 0 0 0 1px #ffffff14, 0 0 0 2px var(--foe), 0 0 34px #ff5a6acc}}
.piles{display:flex; gap:8px; font:700 10px/1.3 var(--f-ui); color:var(--muted); text-align:center}
.pile{width:34px; height:47px; border-radius:4px; display:grid; place-items:center;
  background:repeating-linear-gradient(60deg,#ffffff10 0 1px,transparent 1px 7px), linear-gradient(160deg,#26324a,#0e1320);
  box-shadow:0 0 0 1px #c9d3e670, 2px 2px 0 #0e1320, 3px 3px 0 #c9d3e640; color:var(--text); font:800 12px/1 var(--f-num)}
.pile.trash{background:#ffffff08; box-shadow:inset 0 0 0 1px #ffffff26; color:var(--muted)}
.field{display:flex; justify-content:center; align-items:center; gap:clamp(8px, 3vw, 22px)}
.slot{
  width:var(--slotW, 100px); aspect-ratio:63/88; border-radius:8px; position:relative;
  box-shadow:inset 0 0 0 1.5px var(--zone); background:#ffffff05;
}
.slot::after{content:""; position:absolute; inset:28%; border-radius:50%; box-shadow:inset 0 0 0 1px #ffffff12}
.slot.hot{box-shadow:inset 0 0 0 2px var(--zone-hi), 0 0 24px #8fd8ff55; background:#8fd8ff10}
.slot.hot.over{box-shadow:inset 0 0 0 2.5px #fff, 0 0 30px #8fd8ffaa; background:#8fd8ff22}
.mid{display:flex; align-items:center; gap:12px; padding-block:4px}
.mid::before,.mid::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,#ffffff30,transparent)}
.mid span{font:800 11px/1 var(--f-num); letter-spacing:.3em; color:var(--muted); white-space:nowrap}
.mana{display:flex; flex-direction:column; align-items:center; gap:5px}
.mana small{font:700 9px/1 var(--f-ui); letter-spacing:.14em; color:var(--muted)}
.mana small b{font:800 12px/1 var(--f-num); color:var(--mana); letter-spacing:.04em}
.gems{display:grid; grid-template-columns:repeat(6, 9px); gap:4px}
.gems i{width:9px; height:9px; transform:rotate(45deg); background:linear-gradient(135deg,#e6f7ff,var(--mana)); box-shadow:0 0 6px #8fd8ffaa; transition:all .25s}
.gems i.used{background:#ffffff14; box-shadow:none}
.endturn{
  font:800 12px/1 var(--f-ui); letter-spacing:.12em; color:#0b1018; border:0; border-radius:99px; padding:11px 14px; cursor:pointer;
  background:linear-gradient(100deg,#f7e3a6,var(--gold) 50%,#e2b75a); box-shadow:0 8px 20px -10px #f2cf7a99;
}
.endturn:focus-visible, .ghost:focus-visible{outline:2px solid var(--zone-hi); outline-offset:3px}
.ghost{font:700 11px/1 var(--f-ui); color:var(--muted); background:transparent; border:1px solid #ffffff24; border-radius:99px; padding:8px 10px; cursor:pointer}
.side{display:flex; align-items:center; gap:8px}

/* cards layer */
#cards{position:fixed; inset:0; pointer-events:none; z-index:5}
.unit{position:absolute; left:0; top:0; width:var(--cw, 120px); pointer-events:auto; cursor:grab; will-change:transform; transform-origin:50% 50%}
.unit.dragging{cursor:grabbing}
.unit > div{position:relative; width:100%}
.unit .card{transition:transform .12s ease-out}
.unit.rested .card{filter:saturate(.45) brightness(.8)}
.unit .tag{
  position:absolute; left:50%; bottom:-10px; translate:-50% 0; z-index:9; white-space:nowrap;
  font:800 10px/1 var(--f-ui); letter-spacing:.1em; padding:5px 8px 4px; border-radius:99px; pointer-events:none;
  background:#ff3b4f; color:#fff; box-shadow:0 4px 10px -2px #000a; opacity:0; transition:opacity .2s;
}
.unit.can-attack .tag{opacity:1; animation:bob 1.2s ease-in-out infinite}
.unit.can-attack .card{box-shadow:0 0 0 2px #ff3b4f, 0 0 26px #ff3b4f99}
@keyframes bob{50%{translate:-50% -3px}}
.unit.targetable .card{box-shadow:0 0 0 2px var(--foe), 0 0 26px #ff5a6aaa; animation:pulseU 1s ease-in-out infinite}
.unit.targetable{cursor:pointer}
@keyframes pulseU{50%{box-shadow:0 0 0 2px var(--foe), 0 0 40px #ff5a6aee}}

/* opponent unit (no illustration: generated face) */
.foe .card{
  position:relative; width:100%; aspect-ratio:63/88; border-radius:4.4%/3.2%; overflow:hidden; isolation:isolate;
  background:
    repeating-linear-gradient(0deg, #ff5a6a14 0 2px, transparent 2px 5px),
    radial-gradient(70% 50% at 50% 38%, #4a1620, #12070b 75%);
  box-shadow:0 18px 36px -16px #000, inset 0 0 0 4px #12070b, inset 0 0 0 5px #ff5a6a80;
  font-size:calc(var(--w, 120px) / 24);
}
.foe .glyph{position:absolute; left:50%; top:36%; translate:-50% -50%; width:46%; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 50% 45%, #ffb0b8 0 8%, #ff5a6a 9% 22%, transparent 23%), conic-gradient(from 0deg, #ff5a6a, #ff9a3c, #ff5a6a, #8a1c2b, #ff5a6a);
  -webkit-mask:radial-gradient(circle, transparent 38%, #000 40%); mask:radial-gradient(circle, transparent 38%, #000 40%);
  animation:spin 6s linear infinite; filter:drop-shadow(0 0 10px #ff5a6a)}
@keyframes spin{to{rotate:360deg}}
.foe .fcost{position:absolute; left:5%; top:3.5%; width:17%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:#12070b; box-shadow:0 0 0 1.5px #ff5a6a; font:800 1.9em/1 var(--f-num); color:#ffb0b8}
.foe .fname{position:absolute; left:6%; right:6%; top:62%; text-align:center; font:400 1.2em/1.15 "Dela Gothic One",var(--f-ui); color:#ffe2e5; letter-spacing:.04em}
.foe .ftribe{position:absolute; left:50%; top:56%; translate:-50% 0; font:700 .62em/1 var(--f-ui); letter-spacing:.16em; color:#ff8a96}
.foe .fpow{position:absolute; right:6%; bottom:4%; font:800 1.7em/1 var(--f-num); color:#ffb0b8}
.foe .fpow small{font-size:.32em; letter-spacing:.2em; margin-right:.3em; color:#ff8a96}

/* overlays */
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6}
.flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:7}
.toast{
  position:fixed; left:50%; top:46%; translate:-50% -50%; z-index:8; pointer-events:none; opacity:0;
  max-width:min(86vw, 420px); text-align:center; font:700 13px/1.6 var(--f-ui); letter-spacing:.04em;
  padding:10px 16px; border-radius:12px; background:#0b1018e8; box-shadow:0 0 0 1px #ffffff26, 0 12px 30px -10px #000;
}
.dmg{position:fixed; z-index:8; pointer-events:none; font:800 34px/1 var(--f-num); color:#fff; text-shadow:0 0 12px #ff3b4f, 0 3px 0 #8a1c2b; translate:-50% -50%}
.modal{position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:#05080dd8; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)}
.modal .mc{width:min(78vw, 360px, calc((100vh - 140px) * .716)); perspective:1100px}
.modal .close{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:max(16px, env(safe-area-inset-right,0px)); font:700 13px/1 var(--f-ui); color:var(--text); background:#ffffff14; border:1px solid #ffffff30; border-radius:99px; padding:10px 14px; cursor:pointer}
.modal .mhint{position:absolute; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; font-size:12px; color:var(--muted)}
.hint{position:fixed; left:50%; top:calc(8px + env(safe-area-inset-top,0px)); translate:-50% 0; z-index:8; font:700 11px/1 var(--f-ui); letter-spacing:.08em; color:var(--muted); opacity:.9; pointer-events:none; white-space:nowrap}

%%CSS%%
</style>

<div id="world">
  <div class="board" id="board">
    <div class="ehand" id="ehand"></div>
    <div class="info">
      <div class="leader enemy" id="eLeader"><div class="av">相手</div><div class="lp"><small>フォロワー</small><b id="eLP">20000</b></div></div>
      <div class="piles"><div><div class="pile">27</div>山札</div><div><div class="pile trash" id="eTrash">0</div>トラッシュ</div></div>
    </div>
    <div class="field" id="eField"><div class="slot" data-slot="e0"></div><div class="slot" data-slot="e1"></div><div class="slot" data-slot="e2"></div></div>
    <div class="mid"><span id="turnLabel">YOUR TURN · 1</span></div>
    <div class="field" id="pField"><div class="slot" data-slot="p0"></div><div class="slot" data-slot="p1"></div><div class="slot" data-slot="p2"></div></div>
    <div class="info">
      <div class="leader me"><div class="av">あなた</div><div class="lp"><small>フォロワー</small><b id="pLP">20000</b></div></div>
      <div class="mana"><small>話題力 <b id="manaTxt">12 / 12</b></small><div class="gems" id="gems"></div></div>
      <div class="side">
        <button type="button" class="ghost" id="resetBtn">最初から</button>
        <button type="button" class="endturn" id="endBtn">ターン終了</button>
      </div>
    </div>
    <div></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>

<div id="cards">
  <div class="unit" data-id="c1"><div class="k1"><div class="card">%%C1%%</div></div><span class="tag">攻撃できる</span></div>
  <div class="unit" data-id="c2"><div class="k2"><div class="card">%%C2%%</div></div><span class="tag">速攻 · タップで攻撃</span></div>
  <div class="unit" data-id="c3"><div class="k3"><div class="card">%%C3%%</div></div><span class="tag">攻撃できる</span></div>
  <div class="unit foe" data-id="f1"><div><div class="card"><span class="fcost">4</span><span class="glyph"></span><span class="ftribe">炎上</span><span class="fname">炎上アカウント<br>ZERO</span><span class="fpow"><small>POWER</small>5000</span></div></div><span class="tag"></span></div>
</div>

<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<p class="hint" id="hint">カードをドラッグして場に出す ・ タップで詳細</p>
<div class="modal" id="modal" hidden><button type="button" class="close" id="closeModal">閉じる</button><div class="mc" id="mc"></div><p class="mhint">カーソルやドラッグで傾けられます</p></div>
