services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trends
      POSTGRES_PASSWORD: trends
      POSTGRES_DB: trends
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trends"]
      interval: 3s
      retries: 10
volumes:
  db-data:
