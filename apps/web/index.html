    <style>
      /* 起きるまでのローディング（#boot）。色は app.css の ①ソーダと同じ */
      html, body { background: #dcf0ff; }
      #boot {
        position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden;
        background:
          radial-gradient(#ffffff 1.2px, transparent 1.6px) 0 0 / 20px 20px,
          linear-gradient(180deg, #dcf0ff, #f5faff 55%, #e8f3fb);
      }
      #boot.out { animation: boot-out 0.38s cubic-bezier(.3,.6,.4,1) forwards; pointer-events: none; }
      @keyframes boot-out { to { opacity: 0; transform: scale(1.06); filter: blur(2px); } }
      .boot-mark { position: relative; width: min(58vw, 260px); height: auto; filter: drop-shadow(0 3px 0 #fff); }
      .boot-shine { animation: boot-shine 1.8s ease-in-out infinite; }
      @keyframes boot-shine { 0% { transform: translateX(0); } 60%, 100% { transform: translateX(5200px); } }
      .boot-bubbles { position: absolute; inset: 0; }
      .boot-bubbles i {
        position: absolute; bottom: -24px; border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #ffffff 0 18%, #ffffff55 30%, #9fe3fb66 62%, #2fa8e433 100%);
        box-shadow: inset 0 0 0 1px #ffffffaa; animation: boot-rise linear infinite;
      }
      @keyframes boot-rise {
        0% { transform: translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        50% { transform: translate(var(--sway), -50vh); }
        100% { transform: translate(0, calc(-100vh - 30px)); opacity: 0.2; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-shine, .boot-bubbles i { animation: none; } .boot-bubbles { display: none; } }
    </style>
  </head>
