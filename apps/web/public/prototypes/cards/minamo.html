html,body{height:100%}
body{
  background:radial-gradient(110% 75% at 50% 30%, var(--stage-2), var(--stage) 72%);
  color:var(--cap); font-family:var(--f-body);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  padding-block:24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  overflow:hidden; touch-action:none;
}
.stage{perspective:1100px; width:min(82vw, 400px, calc((100vh - 120px) * 0.716)); max-width:100%}
.card{
  --rx:0deg; --ry:0deg; --mx:50%; --my:50%; --nx:0; --ny:0; --g:0;
  position:relative; width:100%; aspect-ratio:63/88; border-radius:5%/3.6%;
  transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .12s ease-out;
  box-shadow:0 30px 60px -20px #000b, 0 0 60px -12px #5cc8f088, 0 0 0 1px #ffffff40;
  background:var(--pearl); overflow:hidden; isolation:isolate; cursor:grab;
}
.card-inner{position:absolute; inset:0; font-size:calc(var(--w, 360px) / 24)}
.layer{position:absolute; inset:0}
.win{clip-path:inset(4.4% 5.2% 4.4% 5.2% round 3%)}

/* pearl frame: soft aqua sheen that rolls with the light, star glitter on top */
.frame{
  background:
    linear-gradient(120deg, transparent 30%, #ffffffd0 47%, #fff 50%, #ffffffd0 53%, transparent 70%) var(--mx) var(--my)/250% 250% no-repeat,
    linear-gradient(160deg, #e9f8ff, #bfe8fa 35%, #f6fbff 55%, #a9dcf3 80%, #e3f5ff);
}
.frame-iri{
  background:linear-gradient(120deg,#ffb3d1,#ffe9a8,#a8f0d8,#8fd8ff,#c9b3ff,#ffb3d1);
  background-size:300% 300%; background-position:var(--mx) var(--my);
  mix-blend-mode:soft-light; opacity:calc(.35 + var(--g) * .4);
}
.frame-stars{
  background:#fff;
  -webkit-mask:var(--stars) repeat 0 0/110px; mask:var(--stars) repeat 0 0/110px;
  opacity:calc(.35 + var(--g) * .65);
}

/* art */
.bg{
  background:url(../../assets/cards/c3-art.jpg) center 30%/cover no-repeat;
  transform:translate(calc(var(--nx) * -7px), calc(var(--ny) * -7px)) scale(1.05);
}
/* water-ripple holo: rings spread out from where the light lands */
.ripple{
  background:repeating-radial-gradient(circle at var(--mx) var(--my),
    transparent 0, transparent 1.1em, #8fe3ff 1.35em, #ffffff 1.5em, #ffb3d1 1.65em, transparent 1.95em, transparent 2.6em);
  mix-blend-mode:color-dodge; opacity:calc(.1 + var(--g) * .35);
  -webkit-mask-image:radial-gradient(55% 45% at var(--mx) var(--my), #000 0%, transparent 90%);
          mask-image:radial-gradient(55% 45% at var(--mx) var(--my), #000 0%, transparent 90%);
}
.art-stars{
  background:radial-gradient(60% 50% at var(--mx) var(--my), #fff, #bdf0ff 45%, transparent 80%);
  -webkit-mask:var(--stars) repeat calc(var(--nx) * 18px) calc(var(--ny) * 18px)/140px;
          mask:var(--stars) repeat calc(var(--nx) * 18px) calc(var(--ny) * 18px)/140px;
  mix-blend-mode:screen; opacity:calc(.35 + var(--g) * .65);
}
/* rising bubbles */
.bubbles{overflow:hidden; pointer-events:none}
.bubbles i{
  position:absolute; bottom:-12%; left:var(--x); width:var(--s); aspect-ratio:1; border-radius:50%;
  background:
    radial-gradient(circle at 30% 28%, #ffffffee 0 8%, transparent 14%),
    radial-gradient(circle at 50% 50%, transparent 58%, #ffffff55 66%, #8fe3ff88 72%, #ffb3d188 80%, #ffffffaa 88%, transparent 92%);
  animation:rise var(--d) linear infinite; animation-delay:var(--dl);
  opacity:.9;
}
@keyframes rise{
  0%{transform:translate(0,0) scale(.9)}
  50%{transform:translate(calc(var(--sw) * 1px),-60vh) scale(1)}
  100%{transform:translate(0,-125vh) scale(1.05)}
}
.inner-line{
  inset:4.4% 5.2%; border-radius:3%; pointer-events:none;
  box-shadow:0 0 0 1.5px #ffffff, 0 0 0 3px var(--aqua), 0 0 14px 2px #5cc8f077;
}
/* the idol hanging in over the frame */
.subject{
  background:url(../../assets/cards/c3-subject.webp) center 30%/cover no-repeat;
  transform:translate(calc(var(--nx) * 8px), calc(var(--ny) * 8px)) scale(1.05);
  filter:drop-shadow(0 6px 10px #16405a40);
  pointer-events:none;
}
.subject-shine{
  -webkit-mask:url(../../assets/cards/c3-subject.webp) center 30%/cover no-repeat; mask:url(../../assets/cards/c3-subject.webp) center 30%/cover no-repeat;
  transform:translate(calc(var(--nx) * 8px), calc(var(--ny) * 8px)) scale(1.05);
  background:linear-gradient(120deg,#ffb3d1,#ffe9a8,#a8f0d8,#8fd8ff,#c9b3ff,#ffb3d1);
  background-size:300% 300%; background-position:var(--mx) var(--my);
  mix-blend-mode:soft-light; opacity:calc(.2 + var(--g) * .4); pointer-events:none;
}

/* stats and type */
.cost{
  position:absolute; left:2.2%; top:1.6%; width:16.5%; aspect-ratio:1; z-index:3;
  display:grid; place-items:center; border-radius:50%;
  background:
    radial-gradient(circle at 32% 26%, #ffffff 0 10%, transparent 22%),
    radial-gradient(circle at 50% 60%, #9fe6ff, #3fb2e6 55%, #1f8fc4);
  box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--aqua), 0 6px 16px -4px #1f8fc4aa, inset 0 -4px 8px #16405a55;
}
.cost b{font:700 2.3em/1 var(--f-num); color:#fff; text-shadow:0 2px 0 #1f8fc4, 0 0 10px #ffffffaa}
.rarity{
  position:absolute; right:7.4%; top:6%; z-index:3;
  font:700 .76em/1 var(--f-num); letter-spacing:.12em; color:#fff;
  padding:.45em .72em .4em .84em; border-radius:2em;
  background:linear-gradient(110deg,#ff8fbf,#8fd8ff 55%,#a8f0d8);
  box-shadow:0 0 0 1.5px #fff, 0 4px 12px -4px #16405a80;
}
.plate{
  position:absolute; left:8%; right:8%; bottom:5.6%; height:34%;
  z-index:2; display:flex; flex-direction:column; align-items:center;
}
.name{
  display:flex; align-items:baseline; gap:.5em; flex-wrap:wrap; justify-content:center;
  padding:.45em 1.1em .4em; margin-bottom:-.55em; position:relative; z-index:1;
  background:linear-gradient(100deg,#ffffff,#eaf8ff); border-radius:2em;
  box-shadow:0 0 0 1.5px var(--aqua), 0 6px 14px -6px #1f8fc4aa;
}
.name .epi{font:700 .6em/1 var(--f-body); letter-spacing:.1em; color:var(--ink-soft)}
.name h1{
  margin:0; font:800 1.38em/1.05 var(--f-name); letter-spacing:.06em; text-wrap:balance;
  background:linear-gradient(100deg,#1f8fc4,#5cc8f0 30%,#ff8fbf 50%,#5cc8f0 70%,#1f8fc4);
  background-size:250% 100%; background-position:var(--mx) 0;
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.box{
  align-self:stretch; flex:1; display:flex; flex-direction:column; gap:.5em; min-width:0;
  padding:1.15em 1em .75em;
  background:linear-gradient(180deg,#ffffffc8,#f0faffcc);
  backdrop-filter:blur(6px) saturate(1.2); -webkit-backdrop-filter:blur(6px) saturate(1.2);
  border-radius:1.1em;
  box-shadow:inset 0 0 0 1.5px #ffffffd0, 0 0 0 1px #5cc8f070, 0 8px 20px -10px #16405a66;
}
.tribe{
  align-self:flex-start; font:700 .6em/1 var(--f-body); letter-spacing:.16em; color:#fff;
  background:linear-gradient(90deg,var(--aqua-deep),var(--aqua)); padding:.42em .8em .38em; border-radius:2em;
}
.effect{margin:0; font:500 .72em/1.62 var(--f-body); color:var(--ink); text-wrap:pretty}
.effect .kw{font-weight:700; color:var(--aqua-deep)}
.flavor{margin:0; font:700 .64em/1.5 var(--f-body); color:var(--ink-soft)}
.foot{margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:.5em}
.no{font:600 .54em/1 var(--f-num); letter-spacing:.12em; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.power{display:flex; align-items:baseline; gap:.3em}
.power small{font:600 .5em/1 var(--f-num); letter-spacing:.18em; color:var(--ink-soft)}
.power b{
  font:700 1.8em/.9 var(--f-num); font-variant-numeric:tabular-nums;
  background:linear-gradient(100deg,#1f8fc4,#5cc8f0 40%,#ff8fbf 52%,#1f8fc4 70%);
  background-size:250% 100%; background-position:var(--mx) 0;
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.glare{
  z-index:4; pointer-events:none;
  background:radial-gradient(farthest-corner circle at var(--mx) var(--my), #ffffffcc 0%, #ffffff30 22%, transparent 55%);
  mix-blend-mode:overlay; opacity:calc(.3 + var(--g) * .55);
}
.hint{margin:0; font-size:12px; letter-spacing:.08em; color:var(--cap); text-align:center}
@media (prefers-reduced-motion: reduce){.card{transition:none} .bubbles i{animation:none; bottom:20%}}
</style>

<script>
(() => {
  const card = document.getElementById('card');
  const inner = document.getElementById('inner');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = () => inner.style.setProperty('--w', card.clientWidth + 'px');
  fit(); addEventListener('resize', fit);

  let last = 0, active = false;
  function set(nx, ny, g){
    nx = Math.max(-1, Math.min(1, nx)); ny = Math.max(-1, Math.min(1, ny));
    const s = card.style;
    s.setProperty('--nx', nx.toFixed(3));
    s.setProperty('--ny', ny.toFixed(3));
    s.setProperty('--ry', (nx * 16).toFixed(2) + 'deg');
    s.setProperty('--rx', (-ny * 13).toFixed(2) + 'deg');
    s.setProperty('--mx', (50 + nx * 50).toFixed(1) + '%');
    s.setProperty('--my', (50 + ny * 50).toFixed(1) + '%');
    s.setProperty('--g', g.toFixed(2));
  }
  function onMove(e){
    const r = card.getBoundingClientRect();
    const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    const ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    active = true; last = performance.now();
    set(nx, ny, Math.min(1, Math.hypot(nx, ny)));
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerdown', onMove);
  document.addEventListener('pointerleave', () => { active = false; });

  set(-0.3, -0.35, 0.5);
  if (reduce) return;
  function idle(t){
    if (!active || t - last > 2200){
      active = false;
      const s = t / 1000;
      set(Math.sin(s * 0.75) * 0.55, Math.sin(s * 1.05 + 1) * 0.38, 0.45 + Math.sin(s * 0.9) * 0.25);
    }
    requestAnimationFrame(idle);
  }
  requestAnimationFrame(idle);
})();
</script>
