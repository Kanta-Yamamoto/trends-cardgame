<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 88" preserveAspectRatio="none">
  <title>裏向きのカード</title>
  <!-- 闇堕ちの裏向きのカードの地。真ん中の炎は画面が動かして重ねる（Play.tsx の OmenFlame） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#3b1258"/><stop offset=".55" stop-color="#22092f"/><stop offset="1" stop-color="#0a0210"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b06bff" stop-opacity=".55"/><stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx=".5" cy=".75" r=".7">
      <stop offset="0" stop-color="#f3e0ff"/><stop offset=".45" stop-color="#c58bff"/><stop offset="1" stop-color="#6a1fa8"/>
    </radialGradient>
  </defs>
  <rect width="63" height="88" fill="url(#bg)"/>
  <!-- 紫の火の粉 -->
  <g fill="#c58bff">
    <circle cx="9" cy="78" r="2.20" opacity="0.70"/>
    <circle cx="17" cy="68" r="1.10" opacity="0.75"/>
    <circle cx="52" cy="74" r="3.03" opacity="0.55"/>
    <circle cx="46" cy="62" r="1.21" opacity="0.80"/>
    <circle cx="8" cy="52" r="1.43" opacity="0.60"/>
    <circle cx="56" cy="46" r="0.88" opacity="0.80"/>
    <circle cx="12" cy="24" r="0.99" opacity="0.75"/>
    <circle cx="50" cy="20" r="1.76" opacity="0.60"/>
    <circle cx="24" cy="12" r="0.72" opacity="0.90"/>
    <circle cx="40" cy="83" r="0.83" opacity="0.80"/>
    <circle cx="29" cy="76" r="1.54" opacity="0.50"/>
    <circle cx="57" cy="9" r="0.77" opacity="0.80"/>
  </g>
  <rect x="3" y="3" width="57" height="82" rx="5" fill="none" stroke="#d6a8ff" stroke-opacity=".6"/>
  <circle cx="31.5" cy="44" r="20" fill="url(#glow)"/>
  <circle cx="31.5" cy="44" r="16" fill="none" stroke="#d6a8ff" stroke-opacity=".5" stroke-width=".8"/>
</svg>
