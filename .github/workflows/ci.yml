name: CI

# 確かめは手元の pnpm verify が本番（Actions の分数を使い切らないように。docs/working-agreement.md「開発の回し方」）。
# ここは PR を作ったときと、手で動かしたときだけ回る。分数は 1 ジョブごとに分単位で切り上げて数えるので、1 ジョブにまとめる
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI は読むだけ（GitHub のトークンで書き込みはさせない）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trends
          POSTGRES_PASSWORD: trends
          POSTGRES_DB: trends
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trends"
          --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://trends:trends@localhost:5432/trends
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 変わったところを調べる（Docker と Terraform は、関係するところが変わったときだけ確かめる）
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"; echo "terraform=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          FILES=$(git diff --name-only "$BASE" HEAD)
          if echo "$FILES" | grep -qE '(^|/)(Dockerfile|package\.json)$|^pnpm-lock\.yaml$|^\.dockerignore$'; then echo "docker=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$FILES" | grep -q '^infra/terraform/'; then echo "terraform=true" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build packages
        run: pnpm turbo run build --filter=./packages/*
      - name: Migrate DB
        run: pnpm --filter @trends/api db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build API image (push はしない)
        if: steps.changed.outputs.docker == 'true'
        run: docker build -f apps/api/Dockerfile -t trends-api .
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.changed.outputs.terraform == 'true'
      - name: Terraform
        if: steps.changed.outputs.terraform == 'true'
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
