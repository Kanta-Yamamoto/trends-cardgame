name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI は読むだけ（GitHub のトークンで書き込みはさせない）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trends
          POSTGRES_PASSWORD: trends
          POSTGRES_DB: trends
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trends"
          --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://trends:trends@localhost:5432/trends
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build packages
        run: pnpm turbo run build --filter=./packages/*
      - name: Migrate DB
        run: pnpm --filter @trends/api db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image (push はしない)
        run: docker build -f apps/api/Dockerfile -t trends-api .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
