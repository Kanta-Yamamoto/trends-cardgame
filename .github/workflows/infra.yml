name: Infra

# main の infra/terraform が変わったら、Terraform で GCP を更新する。
# 鍵ファイルは使わず、infra/bootstrap.sh で作った連携（main ブランチだけ）でログインする。
# 設定は infra/gcp.env（GCP_PROJECT_NUMBER が空なら何もしない）。
on:
  push:
    branches: [main]
    paths: ["infra/terraform/**", "infra/gcp.env", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 設定を読む（infra/gcp.env）
        id: cfg
        run: |
          grep -E '^[A-Z_]+=' ../gcp.env >> "$GITHUB_ENV"
          . ../gcp.env
          if [ -n "$GCP_PROJECT_NUMBER" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "GCP_PROJECT_NUMBER が未設定なので何もしません" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.cfg.outputs.ok == 'true'
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-bootstrap/providers/github
          service_account: terraform@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.cfg.outputs.ok == 'true'
        with:
          terraform_wrapper: false
      - if: steps.cfg.outputs.ok == 'true'
        run: terraform init -input=false -backend-config="bucket=${GCP_PROJECT_ID}-tfstate"
      - name: terraform apply
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -o pipefail
          if ! terraform apply -auto-approve -input=false -no-color \
            -var "project_id=${GCP_PROJECT_ID}" -var "region=${GCP_REGION}" -var "google_client_id=${GOOGLE_CLIENT_ID}" -var "apple_app_id=${APPLE_APP_ID}" 2>&1 | tee apply.log; then
            # エラー文を注釈に出す（ログを開かなくても、失敗の理由が分かるように）
            grep -A6 '^Error' apply.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: Summary
        if: steps.cfg.outputs.ok == 'true'
        run: |
          echo "### Cloud Run の URL：$(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "招待リンクの合言葉は Secret Manager の invite-code（値はここには出さない。見方・変え方は docs/deploy.md）" >> "$GITHUB_STEP_SUMMARY"
      - name: ログインの設定が届いたか確かめる
        if: steps.cfg.outputs.ok == 'true' && env.GOOGLE_CLIENT_ID != ''
        run: |
          URL=$(terraform output -raw api_url)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/auth/config" | tee config.json | grep -q "$GOOGLE_CLIENT_ID"; then break; fi
            sleep 10
          done
          grep -q "$GOOGLE_CLIENT_ID" config.json || { echo "::error::/auth/config にクライアント ID が出ていません"; exit 1; }
          grep -q '"devLogin":false' config.json || { echo "::error::本番で開発用ログインが有効になっています"; exit 1; }
          echo "Google ログインを有効にしました" >> "$GITHUB_STEP_SUMMARY"
