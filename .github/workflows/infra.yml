name: Infra

# main の infra/terraform が変わったら、Terraform で GCP を更新する。
# 鍵ファイルは使わず、infra/bootstrap.sh で作った連携（main ブランチだけ）でログインする。
# GitHub の Variables（GCP_PROJECT_ID / GCP_PROJECT_NUMBER）が無ければ何もしない。
on:
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  apply:
    if: vars.GCP_PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-bootstrap/providers/github
          service_account: terraform@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
      - run: terraform apply -auto-approve -input=false
      - name: Summary
        run: echo "### Cloud Run の URL：$(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
