name: Deploy

# main の CI（または Infra）が通ったら、Cloud Run に自動でデプロイする。
# GitHub の Variables（GCP_PROJECT_ID / GCP_PROJECT_NUMBER）が無ければ何もしない。
# ログインは Terraform が作った連携とデプロイ用サービスアカウント（鍵ファイルなし）。
on:
  workflow_run:
    workflows: [CI, Infra]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT_NUMBER != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Cloud Run があるか確かめる
        id: ready
        run: |
          if gcloud run services describe trends-api --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "まだ Cloud Run がありません。Infra が終わると自動でもう一度動きます" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and push image
        if: steps.ready.outputs.ok == 'true'
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/trends/api:$SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        if: steps.ready.outputs.ok == 'true'
        run: gcloud run deploy trends-api --image "$IMAGE" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
      - name: Smoke test
        if: steps.ready.outputs.ok == 'true'
        run: |
          URL=$(gcloud run services describe trends-api --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --format 'value(status.url)')
          curl -fsS "$URL/health"
          curl -fsS -H 'Accept: text/html' "$URL/" | grep -q '<title>TRENDS'
          echo "### デプロイしました: $URL" >> "$GITHUB_STEP_SUMMARY"
